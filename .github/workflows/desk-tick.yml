name: Wake the desk

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Check the last closed hour
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 180 "https://grove-wood-bird-plaza.grok.me/api/desk/tick"