name: Wake the desk

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Check the last closed hour
        env:
          DESK_URL: ${{ vars.DESK_URL }}
        run: |
          url="${DESK_URL%/}"
          case "$url" in
            https://*) ;;
            *) echo "Set the DESK_URL repo variable to the published https address."; exit 1 ;;
          esac
          curl -fsS --retry 3 --retry-delay 5 --max-time 180 "$url/api/desk/tick"
